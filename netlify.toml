[build]
  # คำสั่งที่ใช้ในการติดตั้ง dependencies
  command = "npm install" 
  
  # โฟลเดอร์ที่เก็บ Serverless Functions
  functions = "netlify/functions" 

[functions]
  # กำหนด Node.js runtime version
  node_bundler = "esbuild"

[redirects]
  # ชี้การเรียกใช้ทั้งหมดจาก /api/* ไปยัง Function ที่ชื่อ soap-mock
  from = "/api/*"
  to = "/.netlify/functions/soap-mock/:splat"
  status = 200